name: Validate Skill

on:
  push:
    paths:
      - 'SKILL.md'
      - 'references/**'
      - 'scripts/**'
      - 'tests/**'
      - 'ROADMAP.md'
      - 'package.json'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    paths:
      - 'SKILL.md'
      - 'references/**'
      - 'scripts/**'
      - 'tests/**'
      - 'ROADMAP.md'
      - 'package.json'
      - 'README.md'
      - 'LICENSE'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node tests/conformance/run-conformance.mjs tests/conformance/samples/ opencode
